<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body style="margin:0; padding:0; background:#f0f2f5; font-family:Helvetica,Arial,sans-serif;">
  <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background:#f0f2f5;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table border="0" cellpadding="0" cellspacing="0" style="width:620px; max-width:100%; background:#ffffff; border-radius:12px; overflow:hidden;">
          <tr>
            <td style="background:#58595b; padding:20px 32px;">
              <table border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td style="vertical-align:middle;">
                    <a href="https://hutaczestochowa.com.pl" target="_blank" style="text-decoration:none;">
                      <img src="https://portal.hutaczestochowa.com.pl/Images/logo/logo_white.svg" alt="Huta Częstochowa" border="0"
                           style="display:block; height:45px; border:none;" />
                    </a>
                  </td>
                  <td align="right" style="vertical-align:middle;">
                    <img src="https://portal.hutaczestochowa.com.pl/Images/logo/itTeam.png" alt="IT Team" border="0"
                         style="display:block; height:45px; border:none;" />
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:0; background:#f47920;">
              <table border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td style="padding:36px 32px; vertical-align:middle;">
                    <p style="margin:0 0 4px 0; font-size:22px; font-weight:700; color:#ffffff;">Zgłoszenie do IT Support</p>
                    <p style="margin:0; font-size:14px; color:rgba(255,255,255,0.88);">Wiadomość wysłana z indigoERP</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="background:#58595b; height:3px; padding:0; font-size:0; line-height:0;">&nbsp;</td>
          </tr>
          <tr>
            <td style="padding:36px 32px 8px 32px;">
              <p style="margin:0; font-size:15px; line-height:22px; color:#444444;">
                Użytkownik przesłał wiadomość do Działu IT Support:
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px 0 32px;">
              <table border="0" cellpadding="0" cellspacing="0" width="100%"
                     style="background:#fff7f0; border:1px solid #f5d5b8; border-left:4px solid #f47920; border-radius:8px;">
                <tr>
                  <td style="padding:20px 24px;">
                    <p style="margin:0 0 10px 0; font-size:12px; font-weight:700; color:#f47920; letter-spacing:1px; text-transform:uppercase;">
                      Treść zgłoszenia
                    </p>
                    <p style="margin:0; font-size:14px; line-height:22px; color:#444444; font-family:'Courier New',Consolas,monospace;
                              white-space:pre-wrap; word-break:break-word;">{{message}}</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px 40px 32px;">
              <table border="0" cellpadding="0" cellspacing="0" width="100%"
                     style="background:#f7f8fa; border:1px solid #e4e6ea; border-left:4px solid #58595b; border-radius:8px;">
                <tr>
                  <td style="padding:20px 24px;">
                    <p style="margin:0 0 6px 0; font-size:12px; font-weight:700; color:#58595b; letter-spacing:1px; text-transform:uppercase;">
                      Kontakt
                    </p>
                    <p style="margin:0; font-size:14px; line-height:22px; color:#777777;">
                      IT Support:
                      <a href="mailto:itsupport@hutaczestochowa.com.pl" style="color:#f47920; text-decoration:none; font-weight:700;">
                        itsupport@hutaczestochowa.com.pl
                      </a><br />
                      Helpdesk:
                      <span style="color:#58595b; background:#e4e6ea; padding:2px 12px; border-radius:14px; font-weight:700;">8000</span>
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:0; background:#f7f8fa; border-top:1px solid #eeeeee;">
              <table border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td style="padding:20px 32px; vertical-align:middle;">
                    <p style="margin:0; font-size:13px; color:#999999;">
                      IT Team &nbsp;·&nbsp;
                      <a href="http://intranet.hcz.com.pl" style="color:#f47920; text-decoration:none;">intranet.hcz.com.pl</a>
                    </p>
                  </td>
                  <td align="right" style="padding:20px 32px 20px 0;">
                    <p style="margin:0; font-size:11px; color:#bbbbbb; text-align:right;">
                      Wiadomość wygenerowana automatycznie.
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:0; height:4px;">
              <table border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td style="background:#f47920; width:60%; height:4px;"></td>
                  <td style="background:#58595b; width:40%; height:4px;"></td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
